<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分类时间轴</title>
<link rel="stylesheet" href="/style.css">
<style>
body { background: #f5f3ee; }
header { background: var(--accent, #1f3a5f); color: #fff; padding: 1.2rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 1.25rem; }
header .sub { opacity: .75; font-size: .85rem; margin-top: .2rem; }
a.back { color: rgba(255,255,255,.85); font-size: .85rem; text-decoration: none; }
.tabs { max-width: 860px; margin: 1rem auto 0; padding: 0 1rem; display: flex; gap: .6rem; }
.tabs a { flex: 1; text-align: center; padding: .55rem; border-radius: 10px 10px 0 0; background: #e4dfd4; color: #666; text-decoration: none; font-size: .92rem; font-weight: 600; }
.tabs a.active { background: #fff; color: var(--accent, #1f3a5f); box-shadow: 0 -2px 6px rgba(0,0,0,.05); }
main { max-width: 860px; margin: 0 auto; padding: 0 1rem 1.5rem; }
.panel { background: #fff; border-radius: 0 12px 12px 12px; padding: 1.2rem 1.4rem; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
.stat-row { display: flex; gap: 1rem; margin-bottom: 1rem; font-size: .82rem; color: #777; }
.stat-row b { color: var(--accent, #1f3a5f); font-size: 1.05rem; }
#timeline { position: relative; padding-left: 1.4rem; }
#timeline::before { content: ''; position: absolute; left: .45rem; top: 6px; bottom: 6px; width: 2px; background: #c9b98a; }
.item { position: relative; display: flex; gap: .9rem; padding: .55rem 0; align-items: flex-start; }
.item::before { content: ''; position: absolute; left: -1.4rem; top: 1rem; width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--accent, #1f3a5f); background: var(--accent, #1f3a5f); }
.item .time { min-width: 118px; font-weight: 600; font-size: .85rem; color: var(--accent, #1f3a5f); }
.item .body { flex: 1; }
.item .title { font-size: .95rem; }
.item .cat { font-size: .68rem; padding: .1rem .45rem; border-radius: 999px; background: #eee; color: #666; margin: 0 .25rem; vertical-align: middle; }
.item .cat.china { background: #fdecea; color: #c0392b; }
.item .cat.world { background: #eaf2f8; color: #2471a3; }
.item .asp { font-size: .65rem; padding: .08rem .35rem; border-radius: 4px; background: #f0ead8; color: #8a7430; margin-left: .2rem; }
.item .detail { font-size: .8rem; color: #666; margin-top: .2rem; line-height: 1.5; }
.item .loc { font-size: .78rem; color: #888; margin-top: .15rem; }
.empty { color: #999; text-align: center; padding: 1.5rem 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="pageTitle">分类时间轴</h1>
    <p class="sub" id="pageSub"></p>
  </div>
  <a class="back" href="/">← 总表</a>
</header>
<div class="tabs">
  <a href="/aspect/economy" data-a="经济">💰 经济</a>
  <a href="/aspect/politics" data-a="政治">🏛️ 政治</a>
  <a href="/aspect/culture" data-a="文化">📜 文化</a>
</div>
<main>
  <section class="panel">
    <div class="stat-row">
      <span><b id="cnt">0</b> 条事件</span>
      <span>·</span>
      <span>中国史 <b id="cntChina">0</b></span>
      <span>世界史 <b id="cntWorld">0</b></span>
      <span>·</span>
      <span>含多属性 <b id="cntMulti">0</b> 条</span>
    </div>
    <div id="timeline"></div>
  </section>
</main>
<script src="/aspect.js"></script>
</body>
</html>
