<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史地图 · 时间轴</title>
<link rel="stylesheet" href="/style.css">
<style>
body { background: #0e1a2b; color: #dfe8f2; }
#mapWrap { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 20px rgba(0,0,0,.4); }
#worldMap { width: 100%; display: block; background: #0a1420; }
.pin { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; transform: translate(-50%,-50%); cursor: pointer; box-shadow: 0 0 6px rgba(0,0,0,.6); transition: transform .15s; z-index: 2; }
.pin:hover { transform: translate(-50%,-50%) scale(1.5); z-index: 5; }
.pin.china { background: #c0392b; }
.pin.world { background: #2471a3; }
.pin.multi { background: #8e44ad; }
.pin.other { background: #c9b98a; }
.pin .cnt { position: absolute; top: -8px; right: -8px; background: #fff; color: #8e44ad; font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 999px; min-width: 14px; text-align: center; }
#tooltip { position: absolute; pointer-events: none; background: rgba(15,25,40,.95); color: #fff; padding: .5rem .7rem; border-radius: 8px; font-size: .82rem; max-width: 280px; z-index: 10; display: none; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
#tooltip .tt-time { color: #c9b98a; font-weight: 600; font-size: .75rem; }
#tooltip .tt-title { margin-top: .2rem; line-height: 1.4; font-weight: 600; }
#tooltip .tt-detail { margin-top: .25rem; line-height: 1.5; color: #c8d3e0; font-size: .78rem; }
#sliderBox { max-width: 1280px; margin: 1rem auto; padding: 0 1rem; }
#yearDisplay { font-size: 1.5rem; font-weight: 700; color: #c9b98a; text-align: center; margin-bottom: .4rem; }
#timeSlider { width: 100%; position: relative; z-index: 3; }
#sliderLabels { display: flex; justify-content: space-between; font-size: .72rem; color: #7f8c9b; margin-top: .2rem; }
#sliderLabels span { white-space: nowrap; }
#nearbyList { max-width: 1280px; margin: 1rem auto; padding: 1rem; background: rgba(255,255,255,.04); border-radius: 12px; max-height: 300px; overflow-y: auto; }
#nearbyList h3 { margin-bottom: .5rem; font-size: .95rem; color: #c9b98a; }
.nb-item { padding: .4rem 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: .88rem; display: flex; gap: .8rem; align-items: baseline; flex-wrap: wrap; }
.nb-item .t { color: #c9b98a; min-width: 110px; font-size: .8rem; }
.nb-item .c { font-size: .7rem; padding: .05rem .4rem; border-radius: 999px; }
.nb-item .c.china { background: #fdecea; color: #c0392b; }
.nb-item .c.world { background: #eaf2f8; color: #2471a3; }
.nb-item .c.other { background: #eee; color: #666; }
.nb-item .loc { color: #7f8c9b; font-size: .78rem; }
.legend { display: flex; gap: 1rem; justify-content: center; font-size: .78rem; margin-bottom: .6rem; color: #8fa; flex-wrap: wrap; }
.legend span::before { content: '●'; margin-right: .3rem; }
.legend .l-china::before { color: #c0392b; }
.legend .l-world::before { color: #2471a3; }
.legend .l-multi::before { color: #8e44ad; }
.legend .l-other::before { color: #c9b98a; }
header { background: #0a1420; }
a.back { color: #c9b98a; font-size: .85rem; text-decoration: none; }
.mode-note { text-align: center; font-size: .75rem; color: #7f8c9b; margin-top: .3rem; }
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center;">
  <div>
    <h1>🗺️ 历史地图 · 时间轴</h1>
    <p class="sub">拖动时间条，看当时世界各地发生的事</p>
  </div>
  <a class="back" href="/">← 返回总表</a>
</header>

<div class="legend" style="margin-top:1rem;">
  <span class="l-china">中国史</span>
  <span class="l-world">世界史</span>
  <span class="l-multi">跨区事件</span>
  <span class="l-other">其他</span>
</div>

<div id="sliderBox">
  <div id="yearDisplay">—</div>
  <input type="range" id="timeSlider" min="0" max="1000" value="500" step="1">
  <div id="sliderLabels"></div>
  <div class="mode-note">时间条按<b>事件密度</b>非线性分布 —— 史前与近代各占应有篇幅，拖动一格 ≈ 一批事件</div>
  <div style="margin-top:.5rem;text-align:center;font-size:.82rem;color:#7f8c9b;">
    显示 <span id="winInfo">±25 年</span> 内的事件 ·
    <label><input type="radio" name="win" value="5">±5年</label>
    <label><input type="radio" name="win" value="25" checked>±25年</label>
    <label><input type="radio" name="win" value="50">±50年</label>
    <label><input type="radio" name="win" value="200">宽</label>
  </div>
</div>

<div id="mapWrap">
  <img id="worldMap" src="/worldmap.jpg" alt="世界地图">
  <div id="pins"></div>
  <div id="tooltip"></div>
</div>

<div id="nearbyList">
  <h3>📜 此时间段内的事件（<span id="nbCount">0</span> 条）</h3>
  <div id="nbList"></div>
</div>

<script src="/map.js"></script>
</body>
</html>
